# Presupuesto reducido para el dataset sintético y para verificar el pipeline.
# El presupuesto del avance está en experiment.yaml. No hay valores de columnas aquí.
seed: 42
n_seeds_ga: 5
n_random_runs: 5
k_values: [2, 3, 4, 5]
force_k: 3
fitness_sample_size: 220
split: {train: 0.6, val: 0.2, test: 0.2}
ga:
  population: 16
  generations: 8
  elitism: 2
  tournament: 3
  crossover: blend
  mutation: gaussian
  mutation_sigma: 0.15
  mutation_rate: 0.25
  tau: 0.0
  w_max: 0.3
  min_active: 3
  lambda_active: 0.02
  stagnation_patience: 6
  seed_equal_weights: false
  blx_alpha: 0.3
  crossover_rate: 0.9
variants: {v2_alpha: 0.5}
penalties: {min_cluster_frac: 0.05, neff_min: 3, small_cluster_coef: 1.0, neff_coef: 0.25, invalid_score: -1.0}
kmeans: {n_init: 3, random_state: 42}
n_permutations: 20
knn_k: 7
scaler: robust
budget_seconds: 1800
