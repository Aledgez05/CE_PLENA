# Sonda de la penalización de colapso. No sustituye a config/experiment.yaml.
# V1 histórico sigue con collapse_coef 0. Esta sonda no lee la prueba.
seed: 42
n_seeds_ga: 5
n_random_runs: 1
k_values: [2, 3, 4, 5]
force_k: 3
fitness_sample_size: 1500
split: {train: 0.6, val: 0.2, test: 0.2}
ga:
  population: 20
  generations: 20
  elitism: 2
  tournament: 3
  crossover: blend
  mutation: gaussian
  mutation_sigma: 0.2
  mutation_rate: 0.2
  tau: 0.0
  w_max: 0.3
  min_active: 3
  lambda_active: 0.02
  stagnation_patience: 8
  seed_equal_weights: false
  blx_alpha: 0.5
  crossover_rate: 0.8
variants: {v2_alpha: 0.5}
penalties:
  min_cluster_frac: 0.05
  neff_min: 3
  small_cluster_coef: 1.0
  neff_coef: 0.25
  invalid_score: -1.0
  collapse_coef: 1.0
  collapse_tau: 0.15
kmeans: {n_init: 10, random_state: 42}
n_permutations: 100
knn_k: 15
scaler: standard
budget_seconds: null
n_jobs: 0
max_hours: 6
bootstrap_replicates: 400
robustness_partitions: 0
robustness_seeds: 5
positive_minimum: 20
selection_criterion: >
  Sonda de colapso. La aptitud es V1 más la penalización near_collapse.
  La selección usa el ARI medio de validación y está escrita en el protocolo
  de la sonda. La prueba no participa.
