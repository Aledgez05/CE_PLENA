[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plena"
version = "0.2.0"
description = "PLENA: algoritmo genético de dominio real para selección y ponderación de variables en agrupamiento."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "joblib>=1.3",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.7"]
extra = ["pymoo>=0.6", "cma>=3.3", "kmedoids>=0.5"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
